name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -m "not slow"
      - name: Template escaping check
        run: python scripts/check_innerhtml.py
      - name: Lint (pyflakes: any warning fails the build)
        run: python -m pyflakes datadragon.py datadragon_formula.py datadragon_regex.py datadragon_logging.py
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
